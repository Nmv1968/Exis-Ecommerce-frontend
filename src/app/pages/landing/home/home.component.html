<div class="landing-container">
  <!-- Toolbar Section -->
  <mat-toolbar class="d-flex align-items-center justify-content-between">
    <span>Exis</span>
    <div class="d-flex gap-2">
      <button class="toolbar-button" [cdkMenuTriggerFor]="mousepads_submenu">
        Mousepads
      </button>
      <button class="toolbar-button">Mangas</button>
      <button class="toolbar-button">Teclados</button>
      <button class="toolbar-button">Mouse</button>
      <button class="toolbar-button">Audifonos</button>
      <button class="toolbar-button">Accesorios</button>
    </div>
    <div class="d-flex gap-2">
      <button class="toolbar-button" [routerLink]="['/authentication/login']">
        Login
      </button>
    </div>
  </mat-toolbar>

  <!-- Submenu Section -->
  <ng-template #mousepads_submenu>
    <div class="toolbar-menu" cdkMenu>
      <button class="toolbar-menu-item" cdkMenuItem>Mousepads de 90x40</button>
      <button class="toolbar-menu-item" cdkMenuItem>Mousepads de 45x40</button>
    </div>
  </ng-template>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Welcome to Our Store</h1>
      <p>Discover amazing products at great prices</p>
      <button mat-raised-button color="primary">Shop Now</button>
    </div>

    <!--  <div class="row">
      <div class="col-md-4">Hola</div>
      <div class="col-md-4">Hola</div>
      <div class="col-md-4">Hola</div>
    </div> -->
  </section>

  <!-- Featured Categories -->
  <section class="categories-section">
    <h2>Popular Categories</h2>
    <div class="categories-grid">
      <div class="category-card" *ngFor="let i of [1, 2, 3, 4]">
        <mat-card>
          <mat-card-content>
            <h3>Category {{ i }}</h3>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="featured-products">
    <h2>Featured Products</h2>
    <div class="products-grid">
      <mat-card class="product-card" *ngFor="let product of featuredProducts">
        <img mat-card-image [src]="product.image" [alt]="product.name" />
        <mat-card-content>
          <h3>{{ product.name }}</h3>
          <p>${{ product.price }}</p>
          <p>{{ product.description }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary">Add to Cart</button>
          <button mat-button>Learn More</button>
        </mat-card-actions>
      </mat-card>
    </div>
  </section>

  <!-- Call to Action -->
  <section class="cta-section">
    <div class="cta-content">
      <h2>Subscribe to Our Newsletter</h2>
      <p>Get the latest updates and special offers</p>
      <mat-form-field appearance="outline">
        <input matInput placeholder="Enter your email" />
      </mat-form-field>
      <button mat-raised-button color="accent">Subscribe</button>
    </div>
  </section>
</div>
<p>home works!</p>
